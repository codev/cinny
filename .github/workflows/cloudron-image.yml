# Builds the Cloudron app image and pushes it to ghcr.io/codev/cinny
# Tags:
# - the branch name for pushes to dev
# - sha-<short> for a fixed build
# - X.Y.Z for vX.Y.Z release tags

name: Cloudron image

on:
  push:
    branches: [dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cloudron-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/codev/cinny

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cloudron/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name cinny -p 8000:8000 "$IMAGE:test"
          for _ in $(seq 1 30); do
            curl -sf localhost:8000/config.json && break
            sleep 1
          done
          echo
          curl -sf localhost:8000/ | grep -i cinny
          curl -sf localhost:8000/some/route | grep -i cinny
          docker logs cinny
          docker rm -f cinny

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cloudron/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
